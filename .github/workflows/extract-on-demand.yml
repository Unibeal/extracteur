name: Extract on demand
on:
  repository_dispatch:
    types: [extract]
concurrency:
  group: extract-${{ github.event.client_payload.reqId }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write        # nécessaire pour lancer le workflow headless « extract.yml »
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i firebase-admin --no-save --no-audit --no-fund
      - name: Extraction (statique puis headless extract.yml)
        run: node .github/scripts/extract-on-demand.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          GH_TOKEN: ${{ github.token }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          # Réglages facultatifs (valeurs par défaut = celles de l'extracteur complet) : GH_WF, GH_REF, GH_DIR, GH_IN_URL, GH_IN_RID, GH_TPL
