name: Extraction automatique des M3U8

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      only_missing:
        description: "true = seulement les liens manquants / expirés"
        default: "false"

permissions:
  contents: write

concurrency:
  group: auto-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: extracteur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Extraction
        working-directory: extracteur
        env:
          ONLY_MISSING: ${{ github.event.inputs.only_missing || 'false' }}
          LOOKAHEAD_MIN: '200'
          CONCURRENCY: '4'
        run: node auto-extract.mjs
