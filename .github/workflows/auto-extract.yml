name: Extraction automatique des M3U8

on:
  schedule:
    - cron: '0 */3 * * *'   # toutes les 3 h (les tokens durent ~4 h)
  workflow_dispatch:
    inputs:
      only_missing:
        description: "new = seulement les liens JAMAIS extraits · true = manquants + expirés · false = + bientôt expirés"
        default: "new"
      url:
        description: "(test) extraire UNIQUEMENT ce lien, ex. https://uqload.vc/embed-m2mx5t4a4b1l.html"
        required: false

concurrency:
  group: auto-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: extracteur
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund firebase
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright-core install --with-deps chromium
          fi
      - name: Extraction
        working-directory: extracteur
        env:
          ONLY_MISSING: ${{ github.event.inputs.only_missing || 'false' }}
          ONLY_URL: ${{ github.event.inputs.url }}
          LOOKAHEAD_MIN: '200'   # renouvelle tout token qui expire dans moins de 200 min
          MAX_MIN: '100'         # n'attaque plus de nouveau lien après 100 min
        run: |
          # Cherche auto-extract.mjs n'importe où dans le dépôt (racine, extracteur/, ailleurs) et le copie à côté de extract.js
          F=$(find "$GITHUB_WORKSPACE" -iname 'auto-extract*.mjs' -not -path '*/node_modules/*' -not -path '*/.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "❌ auto-extract.mjs est introuvable dans le dépôt. Fichiers présents :"
            find "$GITHUB_WORKSPACE" -type f -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/results/*' | head -60
            exit 1
          fi
          echo "✅ Script trouvé : $F"
          cp "$F" ./_auto-extract-run.mjs
          node _auto-extract-run.mjs
