name: Extract M3U8 (headless)
run-name: Extract ${{ inputs.rid }}
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien embed à extraire"
        required: true
      rid:
        description: "Identifiant de la demande"
        required: true
permissions:
  contents: write      # pour publier results/<rid>.txt
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm i playwright --no-save --no-audit --no-fund
      - name: Chromium de secours (Chrome est déjà présent sur le runner)
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Extraction (node extract.cjs)
        run: node extract.cjs
        env:
          URL_IN: ${{ inputs.url }}
          RID: ${{ inputs.rid }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      - name: Publier le résultat
        if: always()
        env:
          RID: ${{ inputs.rid }}
          BRANCH: ${{ github.ref_name }}
        run: |
          find results -type f -mtime +1 -delete 2>/dev/null || true      # ménage : résultats de plus d'1 jour
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          [ -d results ] || { echo "pas de dossier results"; exit 0; }
          git add -A results
          git commit -m "résultat $RID" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break; sleep 3; done
