name: extract
on:
  workflow_dispatch:
    inputs:
      url: { required: true }
      rid: { required: true }
permissions:
  contents: write
concurrency:
  group: extract-${{ inputs.rid }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i puppeteer@22
      - name: Extract
        env:
          EMBED_URL: ${{ inputs.url }}
          RID: ${{ inputs.rid }}
        run: node extract.js
      - name: Publish result
        if: always()
        env:
          RID: ${{ inputs.rid }}
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add results/
          git commit -m "result $RID" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 3; done
